# Declarations for scripts/validate_skill_checks.py.
#
# Every skill under skills/*/*/ MUST appear under the `skills` key below. A
# skill with no entry fails the harness — a silent skip is how a check that
# cannot fail survives one. A skill that genuinely cannot be exercised from a
# fixture declares `unharnessable:` with the reason.
#
# stage:    a skill's ## Template fence, materialised at the path its own prose
#           names. `group: qa` entries are added only for skills that declare
#           `group: qa` (the QA cluster's Templates presuppose a spec numbered
#           AC-011..019; the spec cluster's own Template writes AC-001..003).
# corpus:   fixture files no Template supplies — application source, lockfiles,
#           CI definitions, the test files several blocks assert exist on disk.
#           Written before the Templates are staged.
# post:     overlays applied after staging, where content must replace or follow
#           a staged Template rather than precede it.
# gates:    gate decisions recorded through the CLI, so delivery/.adlc/events.jsonl
#           exists for the blocks that read a gate's current verdict.
# backdate: files whose mtime must precede everything else (a dependency scan
#           record has to post-date the lockfile it scanned).

change: theme-persistence
model: theme-ranker
lane: full

corpus:
  - path: package.json
    content: |
      { "name": "fixture", "private": true, "scripts": { "test": "node -e \"process.exit(0)\"" } }
  - path: package-lock.json
    content: "{}\n"
  - path: .gitignore
    content: "node_modules/\n.remote.git/\n"

  # A CI definition the pipeline-automation and test-strategy blocks scan. It
  # deliberately contains none of what they forbid: no `|| true`, no floating
  # tag, no literal secret, no blanket retry.
  - path: .github/workflows/ci.yml
    content: |
      name: ci
      on: [push]
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4.1.7
            - run: npm test

  # Application source. The secure-coding, api-design, test-design and
  # test-driven-development blocks grep these trees; each file is written the
  # way those blocks say it should be, so a clean run means the greps ran and
  # found nothing rather than that the tree was absent.
  - path: src/routes/orders.ts
    content: |
      router.get("/v1/orders", listOrders);
      router.post("/v1/orders", createOrder);
  - path: src/errors/handler.ts
    content: |
      export function toBody(kind: string, field: string) {
        return { type: `https://errors.example.com/${kind}`, title: kind, field };
      }
  - path: src/flags/index.ts
    content: |
      export const THEME_PERSISTENCE_ENABLED = "theme-persistence-enabled";
  - path: src/preferences/store.ts
    content: |
      import { randomUUID } from "node:crypto";
      export const newId = () => randomUUID();
      export async function read(db, userId: string) {
        return db.query("select theme from user_preferences where user_id = $1", [userId]);
      }

  # Tests several blocks assert exist by the exact path the artifacts name.
  - path: test/contract/session-v1.spec.ts
    content: "it('AC-011 session contract', () => {});\n"
  - path: test/contract/theme-changed-v1.spec.ts
    content: "it('AC-013 theme changed contract', () => {});\n"
  - path: test/contract/user-preferences-columns.spec.sql
    content: "-- AC-011 column contract\n"
  - path: test/integration/two-tab.spec.ts
    content: "it('AC-011 two tabs', () => {});\n"
  - path: test/unit/resolver.spec.ts
    content: "it('AC-013 resolver', () => {});\n"
  - path: test/integration/store-timeout.spec.ts
    content: "it('AC-015 store timeout', () => {});\n"
  - path: perf/first-render.js
    content: "// AC-016 AC-017 k6 scenario\n"
  - path: security/threat-004.sh
    content: "#!/bin/sh\n# THREAT-004 control test\n"
  - path: test/pipelines/pipe-004-rerun-idempotent.spec.py
    content: "# PIPE-004 rerun idempotency\n"
  - path: ml/baselines/constant_light.py
    content: "# BASELINE-001\n"
  - path: ml/baselines/prefers_color_scheme.py
    content: "# BASELINE-002\n"
  - path: ml/baselines/header_plus_hour.py
    content: "# BASELINE-003\n"
  - path: test/security/session-forgery.spec.ts
    content: "it('THREAT-001 session forgery', () => {});\n"
  - path: test/security/preference-write-ignores-body-userid.spec.ts
    content: "it('THREAT-002 write ignores body user id', () => {});\n"
  - path: test/security/log-redaction.spec.ts
    content: "it('THREAT-003 log redaction', () => {});\n"
  - path: test/security/status-payload-fields.spec.ts
    content: "it('THREAT-004 status payload fields', () => {});\n"
  - path: config/settings.yml
    content: |
      preference_store_url: ${PREFERENCE_STORE_URL}
      session_cookie: theme_session

  # Runbooks the observability, drift-monitoring and data-quality blocks
  # require to exist for every alert, monitor and non-failing check.
  - path: delivery/ops/runbooks/alert-002.md
    content: "# ALERT-002\n\nFirst check the saturation panel, then the last deploy's digest.\n"
  - path: delivery/ops/runbooks/chk-008.md
    content: "# CHK-008\n\nFirst check the quarantine table's row count for the last hour.\n"
  - path: delivery/ops/runbooks/chk-009.md
    content: "# CHK-009\n\nFirst check the producer's schema version against the contract.\n"
  - path: delivery/ops/runbooks/chk-012.md
    content: "# CHK-012\n\nFirst check the join key's null rate in the last landed partition.\n"
  - path: delivery/ops/runbooks/chk-014.md
    content: "# CHK-014\n\nFirst check the watermark against the source's own event time.\n"
  - path: delivery/ops/runbooks/mon-002.md
    content: "# MON-002\n\nFirst check the feature's null rate against the baseline window.\n"
  - path: delivery/ops/runbooks/mon-003.md
    content: "# MON-003\n\nFirst check the prediction histogram against the promotion snapshot.\n"
  - path: delivery/ops/runbooks/mon-004.md
    content: "# MON-004\n\nFirst check the label delay against the outcome table's lag.\n"
  - path: delivery/ops/runbooks/mon-005.md
    content: "# MON-005\n\nFirst check the serving latency panel for the last hour.\n"
  - path: delivery/ops/runbooks/mon-006.md
    content: "# MON-006\n\nFirst check the feature store's freshness timestamp.\n"
  - path: delivery/ops/runbooks/mon-007.md
    content: "# MON-007\n\nFirst check the segment's volume against the baseline window.\n"

  # Evidence indexes the gate-facing blocks read by path.
  - path: "delivery/changes/{change}/evidence/g3-design.md"
    content: |
      # G3 evidence — {change}

      Indexes design.md, ADR-007, ADR-009, ADR-014 and threat-model.md.
  - path: "delivery/changes/{change}/evidence/g8-operate.md"
    content: |
      # G8 evidence — {change}

      Indexes delivery/ops/slo.md, the runbooks and delivery/ops/models/{model}/monitors.md.
  - path: "delivery/changes/{change}/evidence/g6-dependencies-npm.json"
    content: |
      {"findings": ["GHSA-4x7v-2q8m", "GHSA-9wc3-hh7q", "CVE-2026-1188", "GO-2026-3401"]}

  # An ADR the dependency record names as the acceptor of a waived advisory.
  - path: delivery/decisions/ADR-014.md
    content: |
      # ADR-014 — Accept the transitive advisory until the upstream fix lands

      ## Status
      Accepted

      ## Context
      The advisory is reachable only through a code path this service does not call.

      ## Decision
      Accept it until the upstream release, tracked as TASK-047.

      ## Alternatives rejected
      Forking the dependency: the maintenance cost exceeds the residual risk.

      ## Consequences
      The finding stays open in the scan record until the upstream fix lands.

      ## Accepted-risk
      A future caller could reach the vulnerable path without noticing.

      ## Accepted-by
      Ana Costa, 2026-09-28

      ## Binds
      The settings service's dependency set.

      ## Review
      2026-11-15

  # design.md's Linked artifacts table. The design template ships the heading
  # and an empty table; several blocks check the design links their artifact.
  - path: "delivery/changes/{change}/design.md"
    mode: append
    content: |

      | pipeline.md | delivery/changes/{change}/pipeline.md | navi-skill-pipeline-design |
      | rollout.md | delivery/changes/{change}/rollout.md | navi-skill-progressive-delivery |
      | test-strategy.md | delivery/changes/{change}/test-strategy.md | navi-skill-test-strategy |
      | threat-model.md | delivery/changes/{change}/threat-model.md | navi-skill-threat-modelling |

derive_ac_tests: test/acceptance/criteria.spec.ts

# Overlays applied after the Templates are staged.
post:
  # navi-skill-change-proposal's Template illustrates a `standard` change; this
  # fixture runs on `full`, because five skills' blocks refuse to record G4 on
  # any other lane. The proposal's declared gate set has to say so — its own
  # check, and navi-skill-lane-selection's, compare that line with state.json.
  - path: "delivery/changes/{change}/proposal.md"
    replace: ["gates: G1 · G2 · G3 · G5 · G6 · G7 · G8", "gates: G1 · G2 · G3 · G4 · G5 · G6 · G7 · G8 · G9"]
  - path: "delivery/changes/{change}/proposal.md"
    replace: ["lane: standard\n", "lane: full\n"]
  - path: "delivery/changes/{change}/proposal.md"
    replace: ["`standard` — a feature inside an existing capability.", "`full` — the change introduces a model and a dataset."]
  # navi-skill-quality-attributes' QAS scenarios name AC-004 and AC-012 as the
  # criteria they measure. No skill Template defines those two, so the fixture
  # declares them, in the shape navi-skill-spec-authoring defines, under a
  # requirement the task list implements.
  - path: "delivery/changes/{change}/specs/theme-preference/spec.md"
    mode: append
    content: |

      ## Requirements (continued)

      ### REQ-005 — The settings panel reflects the applied theme immediately
      **Priority:** Should
      **Source:** Elicited from ACTOR-002, 2026-09-19

      #### AC-004
      Given a signed-in user on the settings panel,
      when they select a theme,
      then the panel repaints in that theme within 100ms without a page load.
      Implements: REQ-005

      #### AC-012
      Given a signed-in user on the settings panel,
      when the preference write fails,
      then the panel returns to the previously applied theme and states that nothing was saved.
      Implements: REQ-005

  # The model work's own outcome sentence. navi-skill-problem-framing quotes it
  # verbatim from proposal.md and checks the quote resolves;
  # navi-skill-change-proposal's Template illustrates a non-model change, so the
  # fixture supplies the outcome the framing cites.
  - path: "delivery/changes/{change}/proposal.md"
    mode: append
    content: |

      ## Model outcome

      The default-theme chooser is expected to reduce first-session theme switches by 30% for
      users arriving with no stored preference, measured on the existing theme-events report.

  # Tasks for the requirements the staged spec fragments introduce, and the
  # removal task rollout.md names. Every task carries its Implements: line, so
  # T1 and T4 stay clean.
  - path: "delivery/changes/{change}/tasks.md"
    mode: append
    content: |

      - [ ] **TASK-008** Repaint the settings panel in the applied theme without a page load
        - Implements: REQ-005
        - Verified by: AC-004, AC-012
        - Depends on: TASK-002

      - [ ] **TASK-006** Resolve the theme from the request header when the store is unreadable
        - Implements: REQ-015
        - Verified by: AC-015
        - Depends on: TASK-002

      - [ ] **TASK-007** Remove a stored preference when the account is removed
        - Implements: REQ-017
        - Verified by: AC-017
        - Depends on: TASK-001

      - [ ] **TASK-020** Measure and record the non-functional thresholds REQ-020..REQ-027 state
        - Implements: REQ-020
        - Verified by: AC-020
        - Depends on: TASK-005

      - [ ] **TASK-021** Hold availability through a store outage
        - Implements: REQ-021
        - Depends on: TASK-004

      - [ ] **TASK-022** Size the preference store for ten times today's rows
        - Implements: REQ-022
        - Depends on: TASK-001

      - [ ] **TASK-023** Restrict preference reads to the owner and the audited agent
        - Implements: REQ-023
        - Depends on: TASK-001

      - [ ] **TASK-024** Delete a preference with its account
        - Implements: REQ-024
        - Depends on: TASK-001

      - [ ] **TASK-025** Meet AA contrast for body text in both themes
        - Implements: REQ-025
        - Depends on: TASK-002

      - [ ] **TASK-026** Distinguish a theme fault from a store outage in the logs
        - Implements: REQ-026
        - Depends on: TASK-004

      - [ ] **TASK-027** Keep existing session consumers working with the added field
        - Implements: REQ-027
        - Depends on: TASK-001

      - [ ] **TASK-034** Remove the THEME_PERSISTENCE_ENABLED flag and the in-memory path
        - Implements: REQ-001
        - Depends on: TASK-002
        - Notes: removes `src/flags` entry THEME_PERSISTENCE_ENABLED one week after the final wave.

  # The QA cluster's spec. navi-skill-test-strategy, -test-design and
  # -release-readiness are each written against a change whose criteria are
  # AC-011..AC-019; the spec cluster's own Template writes AC-001..AC-003, and a
  # single tree would make one cluster's Template fail a check that is working
  # correctly. This fixture carries exactly the criteria all three of those
  # Templates handle, in the shape navi-skill-spec-authoring defines.
  - group: qa
    path: "delivery/changes/{change}/specs/theme-preference/spec.md"
    content: |
      # Capability — Theme preference

      **Status:** delta for change `{change}`
      **Owner:** Priya Raman

      ## Requirements

      ### REQ-011 — The stored preference is applied on first render
      **Priority:** Must
      **Source:** Elicited from ACTOR-001, 2026-09-18

      #### AC-011
      Given a signed-in user with a stored preference,
      when they load any page,
      then the stored theme is applied before first paint.
      Implements: REQ-011

      ### REQ-013 — An absent preference resolves to the system scheme
      **Priority:** Must
      **Source:** Elicited from ACTOR-001, 2026-09-18

      #### AC-013
      Given a signed-in user with no stored preference,
      when they load any page,
      then the operating-system colour scheme is applied and nothing is written.
      Implements: REQ-013

      ### REQ-015 — The resolver degrades when the store is unreachable
      **Priority:** Must
      **Source:** Elicited from ACTOR-004, 2026-09-19

      #### AC-015
      Given the preference store is unreachable,
      when a first render is requested,
      then the light theme is applied and one warning is logged with the user id omitted.
      Implements: REQ-015

      ### REQ-016 — First render stays inside its latency budget
      **Priority:** Must
      **Source:** Inferred — ASSUM-002

      #### AC-016
      Given production's traffic mix,
      when first render is measured over a rolling 24 hours,
      then p95 is at or below 400ms.
      Implements: REQ-016

gates:
  - { gate: G1, evidence: "delivery/changes/{change}/proposal.md" }
  - { gate: G2, evidence: "delivery/changes/{change}/specs/theme-preference/spec.md" }
  - { gate: G3, evidence: "delivery/changes/{change}/evidence/g3-design.md" }
  # G4 is waived rather than passed: the evidence the data-quality Template
  # ships records a failed check run, and the evaluation records a slice
  # regression. Both skills' blocks report a G4 *pass* over either as a defect,
  # so a corpus that passed G4 would assert something the skills forbid.
  - { gate: G4, waive: "CHK-014 timeliness breach and the SLICE-003 regression are both open; TASK-047 carries the fix." }
  - { gate: G5, evidence: "delivery/changes/{change}/evidence/g5-review.md" }
  - { gate: G7, evidence: "delivery/changes/{change}/evidence/g7-release.md" }
  - { gate: G8, evidence: "delivery/changes/{change}/evidence/g8-operate.md" }

# `gate --waive` leaves the approver column for a person to fill in by hand.
waiver_approver: Ana Costa

# Lockfiles the dependency scan record must post-date. mtime ordering is the
# check, and everything in the corpus is written within the same second.
backdate:
  - package-lock.json

stage:
  # --- the change's backbone -------------------------------------------------
  - { skill: navi-skill-change-proposal, fence: 0, path: "delivery/changes/{change}/proposal.md" }
  - { skill: navi-skill-outcome-and-kpi-definition, fence: 0, path: "delivery/changes/{change}/proposal.md", mode: append }
  - { skill: navi-skill-spec-authoring, fence: 0, path: "delivery/changes/{change}/specs/theme-preference/spec.md" }
  - { skill: navi-skill-non-functional-requirements, fence: 0, path: "delivery/changes/{change}/specs/theme-preference/spec.md", mode: append }
  - { skill: navi-skill-requirements-elicitation, fence: 0, path: "delivery/changes/{change}/specs/theme-preference/elicitation.md" }
  # Fence 1 is the provenance shape a requirement carries in spec.md, and it
  # ships REQ-015 and REQ-017 — the two requirements the elicitation example's
  # own open-questions table refers to. The `## ` prefix closes the preceding
  # `## Non-functional pass` region, which every awk scan in the file ends on.
  - { skill: navi-skill-requirements-elicitation, fence: 1, path: "delivery/changes/{change}/specs/theme-preference/spec.md", mode: append, prefix: "## Requirements (continued)\n\n" }
  - { skill: navi-skill-task-decomposition, fence: 0, path: "delivery/changes/{change}/tasks.md" }
  # --- design and its companions --------------------------------------------
  - { skill: navi-skill-interface-contracts, fence: 0, path: "delivery/changes/{change}/design.md", mode: append }
  - { skill: navi-skill-quality-attributes, fence: 0, path: "delivery/changes/{change}/design.md", mode: append }
  - { skill: navi-skill-threat-modelling, fence: 0, path: "delivery/changes/{change}/threat-model.md" }
  - { skill: navi-skill-decision-records, fence: 0, path: "delivery/decisions/ADR-007.md" }
  - { skill: navi-skill-decision-records, fence: 1, path: "delivery/decisions/ADR-009.md" }
  # --- data ------------------------------------------------------------------
