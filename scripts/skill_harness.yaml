  - { skill: navi-skill-handoff-protocol, fence: 1, path: "delivery/changes/{change}/handoffs.md", mode: append, prefix: "```yaml\n", suffix: "```\n" }
  - { skill: navi-skill-handoff-protocol, fence: 2, path: "delivery/changes/{change}/handoffs.md", mode: append, prefix: "```yaml\n", suffix: "```\n" }
