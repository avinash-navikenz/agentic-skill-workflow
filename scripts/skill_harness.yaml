  - { skill: navi-skill-human-checkpoints, fence: 0, path: "delivery/changes/{change}/handoffs.md", mode: append, prefix: "```yaml\n", suffix: "```\n" }
  - { skill: navi-skill-human-checkpoints, fence: 2, path: "delivery/changes/{change}/handoffs.md", mode: append, prefix: "```yaml\n", suffix: "```\n" }
  - { skill: navi-skill-phase-gate-protocol, fence: 2, path: "delivery/changes/{change}/handoffs.md", mode: append, prefix: "```yaml\n", suffix: "```\n" }
  - { skill: navi-skill-waivers-and-deferrals, fence: 1, path: "delivery/.adlc/waivers.md", mode: append }
  # --- the QA cluster --------------------------------------------------------
  - { group: qa, skill: navi-skill-test-strategy, fence: 0, path: "delivery/changes/{change}/test-strategy.md" }
  - { group: qa, skill: navi-skill-test-design, fence: 0, path: "delivery/changes/{change}/test-design.md" }
  - { group: qa, skill: navi-skill-release-readiness, fence: 0, path: "delivery/changes/{change}/evidence/g6-quality.md" }

skills:

  # ---- informational output ------------------------------------------------
  # Several blocks are written to be *read*, not to be silent: `navi-delivery
  # status` prints the lane and its gates, `validate` prints each validator's
  # summary, and a couple of greps list what the reader must then check by eye.
  # Those lines are declared here, per skill, as regexes. Anything a block emits
  # that is not declared is a failure, and a mutation's expected message must be
  # a line that is *not* declared — the harness refuses a mutation whose expected
  # output the clean run already produces.

  navi-skill-acceptance-criteria:
    mutations:
      - name: an acceptance criterion states a quality as an adjective
        file: "delivery/changes/{change}/specs/theme-preference/spec.md"
        replace: ["then the saved theme is applied before first paint.", "then the saved theme is applied fast."]
        expects: "then the saved theme is applied fast"

  navi-skill-api-design:
    informational:
      - "npx is not run here"
    mutations:
      - name: an object schema lists its required fields and does not forbid unlisted ones
        file: openapi.yaml
        delete_line: "additionalProperties: false"
        expects: "forbid unlisted ones"

  navi-skill-backlog-prioritisation:
    mutations:
      - name: a candidate's cost of delay is outside the four classes
        file: delivery/backlog.md
        replace: ["- **Cost of delay:** compounding —", "- **Cost of delay:** urgent —"]
        expects: "'Cost of delay' is not one of none/linear/deadline/compounding"

  navi-skill-change-proposal:
    informational:
      - "^(change|lane|phase):"
      - "^  G[1-9] +(pass|fail|waived|pending)"
      - "^gates:"
      - "finding\\(s\\)"
      - "^validate: (OK|FAILED)"
    mutations:
      - name: an unfilled template slot survives in the proposal
        file: "delivery/changes/{change}/proposal.md"
        append: "\n**Owner:** <named requirement owner>\n"
        expects: "<named requirement owner>"

  navi-skill-code-review:
    unharnessable: >
      Its two substantive checks read a live pull request's review threads through
      `gh api graphql` — every blocking thread resolved, every review comment class-labelled.
      Neither a fixture nor CI can supply an authenticated GitHub pull request, and stubbing
      `gh` would leave the harness asserting the stub. The three local checks (the G5 review
      record, TODOs without a tracker id, credential-shaped strings in the branch history) are
      exercised indirectly by navi-skill-secure-coding and navi-skill-version-control-workflow,
      which run the same greps against the same fixture.

  navi-skill-commit-craft:
    mutations:
      - name: a Refs trailer names a task that is in no tasks.md
        file: "delivery/changes/{change}/commits/TASK-006.msg"
        replace: ["Refs: TASK-006", "Refs: TASK-906"]
        expects: "Refs names TASK-906, which is in no tasks.md entry"
      - name: one commit carries two reasons for changing
        file: "delivery/changes/{change}/commits/TASK-006.msg"
        replace:
          - "TASK-006: fall back to the request header when the store is unreadable"
          - "TASK-006: fall back to the request header and rename the settings route"
        expects: "joins two changes with 'and'"

  navi-skill-data-contracts:
    mutations:
      - name: a contract loses a mandatory section
        file: "delivery/changes/{change}/specs/data/session-events/contract.md"
        replace: ["## Not fit for\n", "## Unsuitable uses\n"]
        expects: "missing section '## Not fit for'"

  navi-skill-data-quality:
    mutations:
      - name: a check's On breach is outside fail/quarantine/warn
        file: "delivery/changes/{change}/specs/data/session-events/checks.md"
        replace: ["- **On breach:** `quarantine` — rows to", "- **On breach:** `escalate` — rows to"]
        expects: "'On breach' is not one of fail/quarantine/warn"

  navi-skill-decision-records:
    mutations:
      - name: an ADR that accepts a risk names nobody who accepted it
        file: delivery/decisions/ADR-009.md
        replace: ["## Accepted-by\n", "## Signed\n"]
        expects: "ADR-009.md"

  navi-skill-dependency-vulnerabilities:
    mutations:
      - name: a finding row carries no disposition
        file: "delivery/changes/{change}/evidence/g6-dependencies.md"
        replace: ["| 4.3.6 | not-applicable |", "| 4.3.6 | n/a |"]
        expects: "| n/a |"

  navi-skill-drift-monitoring:
    mutations:
      - name: a monitor's threshold loses its consecutive-window count
        file: "delivery/ops/models/{model}/monitors.md"
        replace: ["PSI >= 0.18 for 3 consecutive 24-hour windows.", "PSI >= 0.18."]
        expects: "threshold has no consecutive-window count"

  navi-skill-evaluation-design:
    mutations:
      - name: an EVAL loses the uncertainty its number needs
        file: "delivery/changes/{change}/specs/models/{model}/evaluation.md"
        replace: ["- **Uncertainty:** bootstrap,", "- **Spread:** bootstrap,"]
        expects: "missing Uncertainty"

  navi-skill-handoff-protocol:
    informational:
      - "^handoff envelopes OK$"
      - "^navi-agent-[a-z-]+$"
    mutations:
      - name: an envelope drops one of the eight base fields
        file: "delivery/changes/{change}/handoffs.md"
        replace: ["  skills_used: [navi-skill-spec-authoring, navi-skill-acceptance-criteria, navi-skill-traceability]\n", ""]
        expects: "missing ['skills_used']"

  navi-skill-human-checkpoints:
    informational:
      # The first fence lists every blocked_on / decision / escalated_to line for
      # the reader; the pairing check that follows it is the mechanical one.
      - "^[0-9]+: +(blocked_on|escalated_to|decision):"
    mutations:
      - name: a checkpoint is requested and never answered
        file: "delivery/changes/{change}/handoffs.md"
        replace: ["  decision: approved\n", "  verdict: approved\n"]
        expects: "was requested and never answered"

  navi-skill-incident-response:
    mutations:
      - name: an insight loses the target nobody then owns
        file: "delivery/ops/postmortems/{change}.md"
        replace: ["  - Target: CAND-041,", "  - Destination note: CAND-041,"]
        expects: "no Target line"

  navi-skill-interface-contracts:
    mutations:
      - name: a contract stops answering one of the four failure classes
        file: "delivery/changes/{change}/design.md"
        replace: ["  - duplicate → the call is a read;", "  - repeated → the call is a read;"]
        expects: "no behaviour stated for 'duplicate'"

  navi-skill-lane-selection:
    informational:
      - "^(change|lane|phase):"
      - "^  G[1-9] +(pass|fail|waived|pending)"
      # The last fence is a demonstration of the CLI refusing, not a check. With
      # a change already active the refusal it demonstrates is the
      # one-active-change rule rather than the unknown-lane one.
      - "is already active — archive it first"
    mutations:
      - name: proposal.md's gate set disagrees with the lane the CLI recorded
        file: "delivery/changes/{change}/proposal.md"
        replace: ["gates: G1 · G2 · G3 · G4 · G5 · G6 · G7 · G8 · G9", "gates: G2 · G6 · G7"]
        expects: "and the lane enforces"

  navi-skill-model-cards:
    mutations:
      - name: a slice the evaluation reports is missing from the card
        file: "delivery/changes/{change}/specs/models/{model}/model-card.md"
        replace: ["SLICE-003", "SLICE-903"]
        expects: "which the card omits"

  navi-skill-model-registry-and-promotion:
    mutations:
      - name: two versions sit at production at once
        file: "delivery/ops/models/{model}/registry.md"
        replace: ["- **Stage:** retired (2026-10-02)", "- **Stage:** production (2026-10-02)"]
        expects: "versions are at stage production"

  navi-skill-non-functional-requirements:
    mutations:
      - name: a non-functional category drops out of the pass
        file: "delivery/changes/{change}/specs/theme-preference/spec.md"
        replace: ["| Capacity and growth |", "| Capacity |"]
        expects: "category 'Capacity and growth' is not in the non-functional pass"

  navi-skill-observability:
    mutations:
      - name: an SLI's objective loses its rolling window
        file: delivery/ops/slo.md
        replace: ["- **Objective:** at or above 0.985 over a rolling 28 days", "- **Objective:** at or above 0.985"]
        expects: "objective has no rolling window"

  navi-skill-outcome-and-kpi-definition:
    mutations:
      - name: a KPI's By when is not a date
        file: "delivery/changes/{change}/proposal.md"
        replace: ["- **By when:** 2026-12-31", "- **By when:** end of next quarter"]
        expects: "'By when' is not a date"

  navi-skill-phase-gate-protocol:
    informational:
      - "^(change|lane|phase):"
      - "^  G[1-9] +(pass|fail|waived|pending)"
      - "finding\\(s\\)"
      - "^validate: (OK|FAILED)"
      - '^\{"ts":'
    mutations:
      - name: an artifact is left stale, which validate must refuse
        file: delivery/.adlc/state.json
        replace: ['"stale": []', '"stale": ["gate:G6"]']
        expects: "stale artifact(s) — resolve rework before validating"

  navi-skill-pipeline-automation:
    mutations:
      - name: a pipeline step suppresses its own failure
        file: .github/workflows/ci.yml
        replace: ["      - run: npm test", "      - run: npm test || true"]
        expects: "a pipeline step suppresses its own failure"

  navi-skill-pipeline-design:
    mutations:
      - name: a pipeline's rerun test does not exist
        file: "delivery/changes/{change}/pipeline.md"
        replace: ["test/pipelines/pipe-004-rerun-idempotent.spec.py", "test/pipelines/pipe-004-rerun.spec.py"]
        expects: "rerun test not found"

  navi-skill-problem-framing:
    mutations:
      - name: the framing quotes an outcome the proposal does not contain
        file: "delivery/changes/{change}/specs/models/{model}/framing.md"
        replace: ["reduce first-session theme switches by 30%", "reduce first-session theme switches by 80%"]
        expects: "framing quotes an outcome that is not in proposal.md"

  navi-skill-progressive-delivery:
    mutations:
      - name: a wave's halt condition names no measured quantity
        file: "delivery/changes/{change}/rollout.md"
        replace: ["- **Halt when:** SLI-004 below 0.76 over any rolling 6-hour window,", "- **Stop if:** SLI-004 below 0.76 over any rolling 6-hour window,"]
        expects: "missing Halt when"

  navi-skill-quality-attributes:
    mutations:
      # This is the mechanical form of the rule whose check could not fail: the
      # original wrote `grep -n '**Measure:**' | grep -v '[0-9]'`, and grep -n's
      # own line-number prefix satisfied the digit filter on every line.
      - name: a Measure carries no figure of its own
        file: "delivery/changes/{change}/design.md"
        # Deliberately carries no word from the adjective check's own list: with
        # one, that second check would report the line too and the assertion
        # would pass even with the digit filter broken again.
        replace: ["- **Measure:** AC-004 — p95 time-to-first-paint under 1200ms over a 5-minute window at 500 rps", "- **Measure:** AC-004 — time-to-first-paint under the agreed bound over the agreed window"]
        expects: "under the agreed bound over the agreed window"

  navi-skill-release-readiness:
    group: qa
    mutations:
      - name: a criterion the spec states appears in none of the three sections
        file: "delivery/changes/{change}/evidence/g6-quality.md"
        replace: ["| AC-013 |", "| AC-913 |"]
        expects: "AC-013 appears in 0 of the three sections"

  navi-skill-requirements-elicitation:
    mutations:
      - name: an assumption states nothing that would falsify it
        file: "delivery/changes/{change}/specs/theme-preference/elicitation.md"
        replace: ["- **Falsified by:** a measurable rate of users who change the theme", "- **Checked by:** a measurable rate of users who change the theme"]
        expects: "no 'Falsified by' line"

  navi-skill-secure-coding:
    informational:
      # The skill's own designed output when semgrep is absent. It is the
      # repaired form of the defect that made this block run a 517-byte npm
      # placeholder and report success; asserting the message appears is the
      # point, so it is declared rather than silenced.
      - "^static analysis did not run: semgrep is not installed"
    mutations:
      - name: identity is read from the request rather than the session
        file: src/preferences/store.ts
        append: "export const who = (req) => req.body.user_id;\n"
        expects: "req.body.user_id"

  navi-skill-spec-authoring:
    informational:
      - "finding\\(s\\)"
      - "^validate: (OK|FAILED)"
    mutations:
      - name: a requirement is written without a priority
        file: "delivery/changes/{change}/specs/theme-preference/spec.md"
        replace: ["### REQ-002 — Absent preference falls back to the system scheme\n**Priority:** Must\n", "### REQ-002 — Absent preference falls back to the system scheme\n"]
        expects: "'**Priority:**' line(s) — every requirement carries one"

  navi-skill-task-decomposition:
    informational:
      - "finding\\(s\\)"
      - "^validate: (OK|FAILED)"
      - "^[0-9]+$"
      - "task\\(s\\), no dependency cycle$"
    mutations:
      - name: a task loses the requirement it implements
        file: "delivery/changes/{change}/tasks.md"
        replace: ["  - Implements: REQ-002\n", ""]
        expects: "has no 'Implements: REQ-###' line"

  navi-skill-test-design:
    group: qa
    mutations:
      - name: a case's Automated by does not name the criterion it derives from
        file: "delivery/changes/{change}/test-design.md"
        replace: ["- **Automated by:** `test/integration/stored.spec.ts::AC-011 a stored preference wins over the header`", "- **Automated by:** `test/integration/stored.spec.ts::a stored preference wins over the header`"]
        expects: "'Automated by' does not name AC-011"

  navi-skill-test-driven-development:
    informational:
      - "traceability finding\\(s\\)$"
      - "^> "
    mutations:
      - name: a criterion in the spec is named by no test
        file: "delivery/changes/{change}/specs/theme-preference/spec.md"
        append: "\n### REQ-099 — A criterion with no test\n**Priority:** Won't\n\n#### AC-099\nGiven nothing, when nothing, then nothing.\nImplements: REQ-099\n"
        expects: "AC-099: no test references it"

  navi-skill-test-strategy:
    group: qa
    mutations:
      - name: a risk's likelihood is a rating rather than an observation
        file: "delivery/changes/{change}/test-strategy.md"
        replace: ["- **Level:** unit — the resolver is a pure function", "- **Tier:** unit — the resolver is a pure function"]
        expects: "RISK-002: missing Level"

  navi-skill-threat-modelling:
    mutations:
      - name: a threat's disposition is outside the three permitted words
        file: "delivery/changes/{change}/threat-model.md"
        replace: ["- **Disposition:** accepted — ADR-009", "- **Disposition:** tolerated — ADR-009"]
        expects: "Disposition:** tolerated"

  navi-skill-traceability:
    informational:
      - "finding\\(s\\)"
      - "^validate: (OK|FAILED)"
      # The last fence lists every requirement heading for the reader to check
      # each `Implements:` id against.
      - "spec.md:[0-9]+:#+.*REQ-[0-9]{3,}"
    mutations:
      - name: a task implements a requirement that does not exist
        file: "delivery/changes/{change}/tasks.md"
        replace: ["  - Implements: REQ-003\n", "  - Implements: REQ-993\n"]
        expects: "implements unknown REQ-993"

  navi-skill-version-control-workflow:
    informational:
      # `git rev-list --count HEAD..origin/main`; the block says to expect 0.
      - "^0$"
    mutations:
      - name: a flag in the code has no removal task
        file: src/flags/index.ts
        append: "export const DARK_MODE_ROLLOUT = \"dark-mode-rollout\";\n"
        expects: "flag with no removal task: DARK_MODE_ROLLOUT"

  navi-skill-waivers-and-deferrals:
    informational:
      - "^(change|lane|phase):"
      - "^  G[1-9] +(pass|fail|waived|pending)"
      # `cat delivery/.adlc/waivers.md` — the block prints the register to read.
      - "^# Waivers$"
      - "^Every waived gate is recorded here"
      - "^without an expiry is invalid"
      - "^\\| (Date|-|[0-9]{4}-)"
      - "^\\|------"
      - "live waiver problem\\(s\\)$"
    mutations:
      - name: a waiver row is malformed and silently shifts its columns
        file: delivery/.adlc/waivers.md
        replace: ["| 2026-09-28 | theme-persistence | G6 |", "| 2026-09-28 | theme-persistence |"]
        expects: "malformed waiver row"
