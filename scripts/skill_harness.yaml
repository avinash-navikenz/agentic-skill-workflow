  - { skill: navi-skill-data-contracts, fence: 0, path: "delivery/changes/{change}/specs/data/session-events/contract.md" }
  - { skill: navi-skill-data-quality, fence: 0, path: "delivery/changes/{change}/specs/data/session-events/checks.md" }
  - { skill: navi-skill-data-quality, fence: 1, path: "delivery/changes/{change}/evidence/g4-data-model.md" }
  # --- model -----------------------------------------------------------------
  - { skill: navi-skill-problem-framing, fence: 0, path: "delivery/changes/{change}/specs/models/{model}/framing.md" }
  - { skill: navi-skill-evaluation-design, fence: 0, path: "delivery/changes/{change}/specs/models/{model}/evaluation.md" }
  - { skill: navi-skill-model-cards, fence: 0, path: "delivery/changes/{change}/specs/models/{model}/model-card.md" }
  - { skill: navi-skill-model-registry-and-promotion, fence: 0, path: "delivery/changes/{change}/specs/models/{model}/promotion.md" }
  - { skill: navi-skill-model-registry-and-promotion, fence: 1, path: "delivery/ops/models/{model}/registry.md" }
  - { skill: navi-skill-model-registry-and-promotion, fence: 2, path: "delivery/changes/{change}/evidence/g7-promotion.md" }
  # --- operations ------------------------------------------------------------
  - { skill: navi-skill-observability, fence: 0, path: "delivery/ops/slo.md" }
  - { skill: navi-skill-drift-monitoring, fence: 1, path: "delivery/ops/slo.md", mode: append }
  - { skill: navi-skill-observability, fence: 1, path: "delivery/ops/runbooks/alert-001.md" }
  - { skill: navi-skill-drift-monitoring, fence: 0, path: "delivery/ops/models/{model}/monitors.md" }
  - { skill: navi-skill-pipeline-automation, fence: 0, path: "delivery/ops/delivery-pipeline.md" }
  - { skill: navi-skill-pipeline-automation, fence: 1, path: "delivery/changes/{change}/evidence/g7-release.md" }
  - { skill: navi-skill-progressive-delivery, fence: 0, path: "delivery/changes/{change}/rollout.md" }
  - { skill: navi-skill-backlog-prioritisation, fence: 0, path: "delivery/backlog.md" }
  - { skill: navi-skill-incident-response, fence: 0, path: "delivery/ops/postmortems/{change}.md" }
  - { skill: navi-skill-outcome-and-kpi-definition, fence: 1, path: "delivery/ops/postmortems/{change}.md", mode: append }
  # --- evidence and protocol -------------------------------------------------
  - { skill: navi-skill-code-review, fence: 2, path: "delivery/changes/{change}/evidence/g5-review.md" }
  - { skill: navi-skill-commit-craft, fence: 0, path: "delivery/changes/{change}/commits/TASK-006.msg" }
  - { skill: navi-skill-dependency-vulnerabilities, fence: 0, path: "delivery/changes/{change}/evidence/g6-dependencies.md" }
