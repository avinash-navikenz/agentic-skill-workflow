# Publishes docs/index.html to Azure Static Web Apps, behind Microsoft Entra ID.
#
# Two destinations from one workflow:
#   main -> the production URL
#   dev  -> a named staging environment, with its own URL and the same login
#
# The catalogue is regenerated here rather than trusted from the commit. CI
# already fails a pull request whose generated files are stale, so by merge time
# they are current — but regenerating costs seconds and makes "the published page
# matches the tree" true by construction rather than by convention. A skill or
# agent merged to main therefore appears on the site with no further step.
name: site

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy in flight: a half-uploaded site is worse than a late one.
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: regenerate the catalogue from the tree
        run: |
          python3 scripts/build_catalogue.py . --readmes --inject
          python3 scripts/build_catalogue.py . --check

      - name: assemble the site
        env:
          IS_DEV: ${{ github.ref_name == 'dev' }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          mkdir -p out
          cp docs/index.html out/index.html
          cp site/staticwebapp.config.json out/staticwebapp.config.json
          python3 - <<'PY'
          import os, pathlib, re
          page = pathlib.Path("out/index.html")
          html = page.read_text(encoding="utf8")
          if os.environ["IS_DEV"] == "true":
              # The two copies are pixel-identical otherwise, so the dev one says
              # so. The page carries the banner already; this only turns it on.
              html = html.replace('<html lang="en">', '<html lang="en" data-env="dev">', 1)
              home = os.environ.get("PRODUCTION_URL", "").strip()
              if home:
                  html = html.replace('<a href="../">Open the stable page</a>',
                                      f'<a href="{home}">Open the stable page</a>', 1)
              else:
                  # No production URL configured: a link to nowhere is worse than
                  # no link, so remove it rather than ship a guess.
                  html = re.sub(r'\s*<a href="\.\./">Open the stable page</a>', "", html, count=1)
          page.write_text(html, encoding="utf8")
          print("dev build" if os.environ["IS_DEV"] == "true" else "production build")
          PY

      - name: stamp the tenant into the auth config
        env:
          TENANT: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$TENANT" ]; then
            echo "::error::repository variable AZURE_TENANT_ID is not set — the Entra issuer URL cannot be built, and deploying without it would publish a site nobody can sign in to."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("out/staticwebapp.config.json")
          p.write_text(p.read_text(encoding="utf8").replace("__AZURE_TENANT_ID__", os.environ["TENANT"]), encoding="utf8")
          PY
          grep -q "__AZURE_TENANT_ID__" out/staticwebapp.config.json && { echo "::error::placeholder survived substitution"; exit 1; } || true

      - name: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          # main goes to production; dev gets its own named environment, which
          # Static Web Apps gives a stable URL and the same Entra login.
          deployment_environment: ${{ github.ref_name == 'dev' && 'dev' || '' }}
