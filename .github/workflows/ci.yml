name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The golden path and the Validation harness both build git
          # repositories of their own in temp directories; this checkout is
          # only the source tree, and a shallow one is enough.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt

      # The `test` script is `node --test tests/cli/*.test.js`. The glob is
      # deliberately unquoted: Node 20's test runner takes already-expanded
      # paths, and quoting it hands Node the literal pattern, which it cannot
      # resolve. Do not "fix" the quoting in package.json.
      - name: node test suite
        run: npm test

      - name: python test suite
        run: python3 -m unittest discover -s tests/lint -v

      - name: frontmatter, naming and referential integrity
        run: python3 scripts/validate_manifests.py .

      - name: separation of judgment from rules
        run: python3 scripts/lint_separation.py .

      # Every skill's own ## Validation block, run against its own ## Template,
      # and then against a mutation that violates a rule the block claims to
      # check. A check that stays silent on the violation fails here. A skill
      # missing from scripts/skill_harness.yaml fails here too, so a new skill
      # cannot arrive with unexercised checks.
      - name: skill Validation blocks
        run: python3 scripts/validate_skill_checks.py

      - name: golden path across all four lanes
        run: python3 scripts/golden_path.py

      # adapters/ and templates/delivery/AGENTS.md are generated. Generation is
      # deterministic and already tested, so a diff here means someone edited
      # generated output by hand; the fix is to change the generator or its
      # source, never the artifact.
      - name: adapters are up to date
        run: |
          python3 scripts/build_adapters.py .
          git diff --exit-code adapters templates/delivery/AGENTS.md

      # docs/index.html and every README.md beside a SKILL.md / *.agent.md are
      # generated from the same tree. Adding a skill or an agent therefore needs
      # no edit to either — but it does need this regeneration to have been run,
      # and this step is what fails if it was not.
      - name: field guide and READMEs are up to date
        run: |
          python3 scripts/build_catalogue.py . --readmes --inject
          git diff --exit-code docs/index.html skills agents
